name: Refresh profile

on:
  schedule:
    - cron: "17 13 * * *"   # daily, off the hour (scheduled runs at :00 are often delayed)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/recent.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A failure here fails the run (GitHub emails me) and leaves the last good picture in place.
      # The workflow's own token sees public contributions only. PROFILE_TOKEN is a personal
      # token with the read:user scope, so the trees also count work in private repositories.
      - run: python3 scripts/world.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        if: always()
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh profile"
            git push
          fi
